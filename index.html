<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #f5f5f5;
      font-family: ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* The stage fills the whole window (and the whole screen in fullscreen). */
    .stage {
      position: fixed;
      inset: 0;
      background: #000;
    }

    /* Both videos are stacked on top of each other and fill the stage.
       `contain` keeps the full frame visible with no cropping.
       No `controls` attribute -> no player UI is visible. */
    .stage video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }

    /* Video 2 stays hidden until video 1 has finished. */
    .stage video.is-hidden {
      visibility: hidden;
    }

    /* Thumbs-down button: centered over the video. */
    .down-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      appearance: none;
      background: rgba(22, 22, 22, 0.7);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #f5f5f5;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 120ms ease,
                  background 160ms ease,
                  border-color 160ms ease,
                  opacity 250ms ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .down-btn:hover:not(:disabled) {
      background: rgba(40, 40, 40, 0.85);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .down-btn:active:not(:disabled) {
      transform: translate(-50%, -50%) scale(0.9);
    }
    /* Hide the button (with a smooth fade) once it has been pressed */
    .down-btn.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
    .down-btn:focus-visible {
      outline: 2px solid #888;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <!-- `#t=0.001` makes Safari/iOS paint the first frame before playback. -->
    <video
      id="vid1"
      src="video1.mp4#t=0.001"
      preload="auto"
      playsinline
      disablepictureinpicture
      controlslist="nodownload noplaybackrate nofullscreen noremoteplayback"
    ></video>

    <video
      id="vid2"
      class="is-hidden"
      src="Video2.mp4#t=0.001"
      preload="auto"
      playsinline
      disablepictureinpicture
      controlslist="nodownload noplaybackrate nofullscreen noremoteplayback"
    ></video>

    <button class="down-btn" id="downBtn" aria-label="Thumbs down" title="Thumbs down">
      👎
    </button>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const vid1 = document.getElementById('vid1');
    const vid2 = document.getElementById('vid2');
    const btn = document.getElementById('downBtn');

    function hideButton() {
      btn.classList.add('is-hidden');
      btn.disabled = true;
    }
    function showButton() {
      btn.classList.remove('is-hidden');
      btn.disabled = false;
    }

    // ----- Click: go fullscreen and play video 1 all the way through -----
    btn.addEventListener('click', () => {
      hideButton();

      // Fullscreen must be requested during the click itself; browsers
      // refuse it later. If it isn't supported (e.g. iPhone), the page
      // already fills the window.
      const requestFs = stage.requestFullscreen || stage.webkitRequestFullscreen;
      if (requestFs) {
        try {
          const p = requestFs.call(stage);
          if (p && p.catch) p.catch(() => {});
        } catch (_) {}
      }

      vid1.play().catch(err => {
        console.warn('Video play() was blocked:', err);
        showButton();
      });
    });

    // ----- Video 1 finished: show video 2's first frame and stay there -----
    vid1.addEventListener('ended', () => {
      vid2.classList.remove('is-hidden');
      vid1.classList.add('is-hidden');
    });
  </script>

  <!--
    Files expected next to this index.html in the repo:
      • video1.mp4   (shown on load, plays when the button is pressed)
      • Video2.mp4   (its first frame is shown after video1 ends)
    File names are case-sensitive on GitHub Pages.
    GitHub Pages: Settings → Pages → Source: main / root.
  -->
</body>
</html>
