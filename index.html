<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #f5f5f5;
      font-family: ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* The stage fills the whole window (and the whole screen in fullscreen). */
    .stage {
      position: fixed;
      inset: 0;
      background: #000;
    }

    /* Both videos are stacked on top of each other and fill the stage.
       `contain` keeps the full frame visible with no cropping.
       No `controls` attribute -> no player UI is visible. */
    .stage video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }

    /* Video 2 stays hidden until video 1 has finished. */
    .stage video.is-hidden {
      visibility: hidden;
    }

    /* ---------- Live invisible buttons ---------- */

    /* Clickable areas for the current section. Fully transparent. */
    .live-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .live-btn {
      position: absolute;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      appearance: none;
      cursor: pointer;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }
    .live-btn:focus { outline: none; }
    /* In dev mode only the editable squares respond to the mouse. */
    body.dev .live-layer { display: none; }

    /* ---------- Dev mode squares (hotspots) ---------- */

    /* Layer that holds the hotspot squares, on top of the videos. */
    .hotspot-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    body.dev .hotspot-layer { pointer-events: auto; }
    body.dev.drawing .hotspot-layer { cursor: crosshair; }

    /* Outside dev mode the squares are invisible and inactive. */
    .hotspot {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    body.dev .hotspot {
      opacity: 1;
      pointer-events: auto;
      border: 2px solid #ffd400;
      background: rgba(255, 212, 0, 0.14);
    }
    body.dev.drawing .hotspot { pointer-events: none; }
    body.dev .hotspot.is-main {
      border-color: #3ddc84;
      background: rgba(61, 220, 132, 0.14);
    }

    .hotspot-num {
      position: absolute;
      top: -2px;
      left: -2px;
      min-width: 20px;
      padding: 2px 6px;
      background: #ffd400;
      color: #000;
      font: 700 12px/16px ui-sans-serif, system-ui, sans-serif;
      text-align: center;
    }
    .hotspot.is-main .hotspot-num { background: #3ddc84; }

    .hotspot-del {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 20px;
      height: 20px;
      padding: 0;
      border: 0;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font: 700 14px/20px ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
    }

    .hotspot-name {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: calc(100% - 12px);
      max-width: 100%;
      padding: 2px 4px;
      border: 0;
      outline: none;
      background: transparent;
      color: #fff;
      font: 600 14px/1.2 ui-sans-serif, system-ui, sans-serif;
      text-align: center;
      text-shadow: 0 1px 3px #000, 0 0 2px #000;
    }
    .hotspot-name::placeholder { color: rgba(255, 255, 255, 0.7); }
    .hotspot-name:focus { background: rgba(0, 0, 0, 0.45); }

    /* ---------- Dev mode menu ---------- */

    .dev-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 260px;
      padding: 12px 14px;
      background: rgba(12, 12, 12, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.45;
      z-index: 10;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }
    .dev-panel[hidden] { display: none; }
    .dev-panel h2 {
      margin: 0 0 6px;
      font-size: 14px;
      color: #ffd400;
    }
    .dev-panel p { margin: 0 0 6px; }
    .dev-panel kbd {
      display: inline-block;
      min-width: 18px;
      padding: 0 4px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 3px;
      font: 12px/16px ui-monospace, monospace;
      text-align: center;
    }
    .dev-section {
      display: flex;
      gap: 6px;
      align-items: center;
      margin: 10px 0 0;
    }
    .dev-section select,
    .dev-section input {
      font: inherit;
      background: #222;
      color: #f5f5f5;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      padding: 3px 6px;
    }
    .dev-section input { flex: 1; min-width: 0; }
    .dev-status {
      margin: 8px 0;
      padding: 6px 8px;
      background: rgba(255, 212, 0, 0.12);
      border-radius: 4px;
      color: #ffd400;
    }
    .dev-list {
      margin: 0;
      padding: 0;
      list-style: none;
      max-height: 180px;
      overflow: auto;
    }
    .dev-list li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dev-panel.is-collapsed .dev-body { display: none; }

    /* "dev mode" label in the top-right corner while dev mode is on. */
    .dev-badge {
      position: fixed;
      top: 12px;
      right: 16px;
      color: #3ddc84;
      font: 700 16px/1 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.04em;
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
      z-index: 20;
    }
    .dev-badge[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <!-- `#t=0.001` makes Safari/iOS paint the first frame before playback. -->
    <video
      id="vid1"
      src="Video1.mp4#t=0.001"
      preload="auto"
      playsinline
      disablepictureinpicture
      controlslist="nodownload noplaybackrate nofullscreen noremoteplayback"
    ></video>

    <video
      id="vid2"
      class="is-hidden"
      src="Video2.mp4#t=0.001"
      preload="auto"
      playsinline
      disablepictureinpicture
      controlslist="nodownload noplaybackrate nofullscreen noremoteplayback"
    ></video>

    <div class="live-layer" id="liveLayer"></div>

    <div class="hotspot-layer" id="hotspotLayer"></div>

    <div class="dev-panel" id="devPanel" hidden>
      <h2>Dev mode</h2>
      <div class="dev-body">
        <p><kbd>1</kbd> draw Button 1 (the main button)</p>
        <p><kbd>2</kbd>–<kbd>9</kbd> draw other buttons</p>
        <p>Drag to draw a square, type its name, press <kbd>Enter</kbd>.
           Drawing a number again replaces it. <kbd>×</kbd> deletes.</p>
        <p><kbd>Esc</kbd> cancel drawing · <kbd>H</kbd> hide this menu</p>
        <p>Hold <kbd>Enter</kbd> 2 s: close, hide squares, download .txt</p>
        <div class="dev-section">
          <label for="devSection">Section</label>
          <select id="devSection">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
          </select>
          <input id="devSectionName" type="text" placeholder="Section name" aria-label="Section name" />
        </div>
        <div class="dev-status" id="devStatus"></div>
        <ul class="dev-list" id="devList"></ul>
      </div>
    </div>

    <div class="dev-badge" id="devBadge" hidden>dev mode</div>
  </div>

  <script>
    const vid1 = document.getElementById('vid1');
    const vid2 = document.getElementById('vid2');
    const VIDEOS = { 'Video1.mp4': vid1, 'Video2.mp4': vid2 };

    // =====================================================================
    // Sections: each section is a scene with its own set of invisible
    // buttons. Only the current section's buttons are active.
    // =====================================================================

    // The picture each section is shown over.
    const SCENES = {
      1: { video: 'Video1.mp4', frame: 'first' },
      2: { video: 'Video2.mp4', frame: 'last' },
    };

    // Live buttons, from button-layout.txt. x, y, w, h are fractions (0–1)
    // of the video frame, so they line up at any window size.
    const LAYOUT = {
      1: {
        name: 'LaunchScreen',
        buttons: {
          1: { name: 'Disk', video: 'Video1.mp4',
               x: 0.1022, y: 0.8474, w: 0.1794, h: 0.09 },
          2: { name: 'Videotape', video: 'Video1.mp4',
               x: 0.7343, y: 0.756, w: 0.209, h: 0.2108 },
          3: { name: 'Interview with the vampire poster', video: 'Video1.mp4',
               x: 0.0361, y: 0.0113, w: 0.2833, h: 0.7812 },
        },
      },
      // 2: Section 2 buttons go here (shown over Video2.mp4's last frame).
    };

    // What each live button does: ACTIONS[section][button]().
    const ACTIONS = {
      1: {
        1: playDiskVideo,               // Disk
        2: () => batmanSounds.play(),   // Videotape
        3: () => vampireSounds.play(),  // Interview with the vampire poster
      },
    };

    const layer = document.getElementById('hotspotLayer');
    const liveLayer = document.getElementById('liveLayer');
    let currentSection = 1; // null while a video is playing between sections
    let devMode = false;

    // ----- Sounds -----

    let currentSound = null;
    function stopSound() {
      if (currentSound) {
        currentSound.pause();
        currentSound = null;
      }
    }

    // Plays Prefix01.mp3, Prefix02.mp3, … one per click, and goes back to
    // Prefix01.mp3 once the next numbered file doesn't exist.
    function soundCycle(prefix) {
      let next = 1;
      const exists = {}; // file number -> true / false once checked
      const url = (n) => prefix + String(n).padStart(2, '0') + '.mp3';

      function check(n) {
        if (n in exists) return;
        fetch(url(n), { method: 'HEAD', cache: 'no-store' })
          .then((r) => { exists[n] = r.ok; })
          .catch(() => {}); // unknown (e.g. opened from disk): just try it
      }
      check(1);
      check(2);

      function play() {
        if (exists[next] === false) next = 1;
        const n = next;
        stopSound();
        const audio = new Audio(url(n));
        currentSound = audio;
        // The file wasn't there after all: start over at 01.
        audio.addEventListener('error', () => {
          exists[n] = false;
          if (n !== 1 && currentSound === audio) {
            next = 1;
            play();
          }
        });
        audio.play().catch(() => {});
        next = n + 1;
        check(next);
      }
      return { play };
    }

    const batmanSounds = soundCycle('Batman');
    const vampireSounds = soundCycle('Vampire');

    // ----- Scenes and live buttons -----

    function visibleVideo() {
      return vid2.classList.contains('is-hidden') ? vid1 : vid2;
    }
    function videoFileName(v) {
      return v.getAttribute('src').split('#')[0];
    }

    // Show a section's picture (first or last frame of its video), paused.
    function showScene(section) {
      const scene = SCENES[section];
      if (!scene) return;
      const v = VIDEOS[scene.video];
      for (const other of Object.values(VIDEOS)) {
        other.pause();
        if (other !== v) other.classList.add('is-hidden');
      }
      v.classList.remove('is-hidden');
      const seek = () => {
        try {
          v.currentTime = scene.frame === 'last' ? Math.max(0, v.duration - 0.001) : 0;
        } catch (_) {}
      };
      if (v.readyState >= 1) seek();
      else v.addEventListener('loadedmetadata', seek, { once: true });
    }

    function renderLive() {
      liveLayer.innerHTML = '';
      const section = currentSection;
      const sec = LAYOUT[section];
      if (!sec) return;
      const f = frameRect();
      for (const [num, b] of Object.entries(sec.buttons)) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'live-btn';
        btn.setAttribute('aria-label', b.name);
        placeElement(btn, b, f);
        btn.addEventListener('click', () => {
          if (devMode || currentSection !== section) return;
          const action = ACTIONS[section] && ACTIONS[section][num];
          if (action) action();
        });
        liveLayer.appendChild(btn);
      }
    }

    function setSection(section) {
      currentSection = section;
      renderLive();
    }

    // Disk: play Video2.mp4 and freeze on its last frame, then Section 2.
    function playDiskVideo() {
      setSection(null); // Section 1 buttons stop working
      stopSound();
      vid1.pause();
      vid1.classList.add('is-hidden');
      vid2.classList.remove('is-hidden');
      try { vid2.currentTime = 0; } catch (_) {}
      vid2.play().catch((err) => {
        console.warn('Video play() was blocked:', err);
        showScene(1);
        setSection(1);
      });
    }

    // A finished video stays on its last frame.
    vid2.addEventListener('ended', () => {
      if (currentSection === null && !devMode) setSection(2);
    });

    // =====================================================================
    // Dev mode: draw invisible buttons over the video and export them.
    //   hold Enter for 2 seconds   open / close dev mode
    //   Section dropdown           which section you're placing buttons in
    //   1–9                        draw that button
    // Positions are stored as fractions (0–1) of the video frame, so they
    // line up no matter how big the window is.
    // =====================================================================
    const panel = document.getElementById('devPanel');
    const statusEl = document.getElementById('devStatus');
    const listEl = document.getElementById('devList');
    const badge = document.getElementById('devBadge');
    const sectionSelect = document.getElementById('devSection');
    const sectionNameInput = document.getElementById('devSectionName');

    const STORE_KEY = 'invisible-buttons-v2';
    const MIN_SIZE = 6; // px; smaller drags are ignored as accidental clicks
    const HOLD_MS = 2000; // how long Enter must be held to toggle dev mode

    // { "1": { name, buttons: { "1": { x, y, w, h, name, video }, … } }, … "9" }
    let devData = loadDevData();
    let devSection = '1';
    let hotspots = devData[devSection].buttons; // buttons of devSection
    const elements = {};                        // number -> square element
    let drawNum = null;                         // button number waiting to be drawn
    let drag = null;                            // in-progress drag

    // Saved drawings, with any section not drawn yet filled in from LAYOUT.
    function loadDevData() {
      let data = null;
      try {
        data = JSON.parse(localStorage.getItem(STORE_KEY));
      } catch (_) {}
      if (!data || typeof data !== 'object') data = {};
      for (let s = 1; s <= 9; s++) {
        if (!data[s]) {
          data[s] = LAYOUT[s]
            ? JSON.parse(JSON.stringify(LAYOUT[s]))
            : { name: '', buttons: {} };
        }
      }
      return data;
    }
    function saveHotspots() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(devData)); } catch (_) {}
    }

    // Where the video picture actually sits inside the stage (object-fit: contain
    // adds black bars when the window isn't 16:9).
    function frameRect() {
      const v = visibleVideo();
      const vw = v.videoWidth || 1280;
      const vh = v.videoHeight || 720;
      const box = layer.getBoundingClientRect();
      const scale = Math.min(box.width / vw, box.height / vh);
      const width = vw * scale;
      const height = vh * scale;
      return {
        left: (box.width - width) / 2,
        top: (box.height - height) / 2,
        width, height, vw, vh,
        boxLeft: box.left, boxTop: box.top,
      };
    }

    // Pointer position -> fraction of the video frame, clamped to the frame.
    function toFrame(e, f) {
      const x = (e.clientX - f.boxLeft - f.left) / f.width;
      const y = (e.clientY - f.boxTop - f.top) / f.height;
      return { x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y)) };
    }

    function placeElement(el, r, f) {
      el.style.left = (f.left + r.x * f.width) + 'px';
      el.style.top = (f.top + r.y * f.height) + 'px';
      el.style.width = (r.w * f.width) + 'px';
      el.style.height = (r.h * f.height) + 'px';
    }

    function makeElement(num) {
      const el = document.createElement('div');
      el.className = 'hotspot' + (num === '1' ? ' is-main' : '');
      el.dataset.num = num;

      const badge = document.createElement('span');
      badge.className = 'hotspot-num';
      badge.textContent = num;

      const del = document.createElement('button');
      del.className = 'hotspot-del';
      del.type = 'button';
      del.title = 'Delete button ' + num;
      del.textContent = '×';
      del.addEventListener('click', () => {
        delete hotspots[num];
        el.remove();
        delete elements[num];
        saveHotspots();
        updatePanel();
      });

      const input = document.createElement('input');
      input.className = 'hotspot-name';
      input.type = 'text';
      input.placeholder = 'Button ' + num + ' name';
      input.addEventListener('input', () => {
        if (hotspots[num]) {
          hotspots[num].name = input.value;
          saveHotspots();
          updatePanel();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === 'Escape') {
          e.preventDefault();
          input.blur();
        }
      });

      el.append(badge, del, input);
      layer.appendChild(el);
      elements[num] = el;
      return el;
    }

    function renderAll() {
      const f = frameRect();
      for (const num of Object.keys(hotspots)) {
        const el = elements[num] || makeElement(num);
        el.querySelector('.hotspot-name').value = hotspots[num].name || '';
        placeElement(el, hotspots[num], f);
      }
    }

    // Switch which section's squares are shown and edited.
    function switchDevSection(section) {
      stopDrawing();
      for (const num of Object.keys(elements)) {
        elements[num].remove();
        delete elements[num];
      }
      devSection = section;
      hotspots = devData[section].buttons;
      sectionSelect.value = section;
      sectionNameInput.value = devData[section].name || '';
      showScene(section);
      renderAll();
      updatePanel();
    }

    function updatePanel() {
      statusEl.textContent = drawNum
        ? 'Drawing Button ' + drawNum + ' in Section ' + devSection + ': drag on the video.'
        : 'Press 1–9 to draw a button.';
      listEl.innerHTML = '';
      const nums = Object.keys(hotspots).sort();
      if (!nums.length) {
        const li = document.createElement('li');
        li.textContent = 'No buttons in Section ' + devSection + ' yet.';
        listEl.appendChild(li);
      }
      for (const num of nums) {
        const li = document.createElement('li');
        li.textContent = 'Button ' + num + ': ' + (hotspots[num].name || '(no name)');
        listEl.appendChild(li);
      }
    }

    function startDrawing(num) {
      drawNum = num;
      document.body.classList.add('drawing');
      updatePanel();
    }
    function stopDrawing() {
      drawNum = null;
      drag = null;
      document.body.classList.remove('drawing');
      updatePanel();
    }

    sectionSelect.addEventListener('change', () => {
      switchDevSection(sectionSelect.value);
      // Hand the keyboard back so 1–9 draw buttons instead of changing sections.
      sectionSelect.blur();
    });
    sectionNameInput.addEventListener('input', () => {
      devData[devSection].name = sectionNameInput.value;
      saveHotspots();
    });
    sectionNameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === 'Escape') {
        e.preventDefault();
        sectionNameInput.blur();
      }
    });

    layer.addEventListener('pointerdown', (e) => {
      if (!devMode || !drawNum) return;
      e.preventDefault();
      const f = frameRect();
      const start = toFrame(e, f);
      const el = elements[drawNum] || makeElement(drawNum);
      drag = { num: drawNum, start, f, el, prev: hotspots[drawNum] };
      placeElement(el, { x: start.x, y: start.y, w: 0, h: 0 }, f);
      layer.setPointerCapture(e.pointerId);
    });

    layer.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const p = toFrame(e, drag.f);
      const s = drag.start;
      drag.rect = {
        x: Math.min(s.x, p.x), y: Math.min(s.y, p.y),
        w: Math.abs(p.x - s.x), h: Math.abs(p.y - s.y),
      };
      placeElement(drag.el, drag.rect, drag.f);
    });

    // Pointer lost mid-drag (e.g. a system gesture): undo that drag.
    layer.addEventListener('pointercancel', () => {
      if (!drag) return;
      const { num, f, el, prev } = drag;
      if (prev) placeElement(el, prev, f);
      else { el.remove(); delete elements[num]; }
      drag = null;
    });

    layer.addEventListener('pointerup', () => {
      if (!drag) return;
      const { num, rect, f, el, prev } = drag;
      const tooSmall = !rect || rect.w * f.width < MIN_SIZE || rect.h * f.height < MIN_SIZE;
      if (tooSmall) {
        // Put things back the way they were.
        if (prev) placeElement(el, prev, f);
        else { el.remove(); delete elements[num]; }
        drag = null;
        return;
      }
      hotspots[num] = {
        ...rect,
        name: prev ? prev.name : '',
        video: videoFileName(visibleVideo()),
      };
      saveHotspots();
      stopDrawing();
      const input = el.querySelector('.hotspot-name');
      input.value = hotspots[num].name;
      input.focus();
      input.select();
    });

    function openDevMode() {
      devMode = true;
      stopSound();
      document.body.classList.add('dev');
      panel.hidden = false;
      badge.hidden = false;
      // Start on the section you're in (Section 2 if Video2 is mid-play).
      switchDevSection(String(currentSection || 2));
    }

    function closeDevMode() {
      if (document.activeElement && document.activeElement.blur) {
        document.activeElement.blur();
      }
      stopDrawing();
      devMode = false;
      document.body.classList.remove('dev');
      panel.hidden = true;
      badge.hidden = true;
      saveHotspots();
      // Go back to the live scene. If dev mode interrupted Video2, finish it.
      if (currentSection === null) currentSection = 2;
      showScene(currentSection);
      renderLive();
      downloadLayout();
    }

    function pct(n) { return (n * 100).toFixed(2) + '%'; }

    function sceneLabel(section) {
      const scene = SCENES[section];
      return scene ? scene.video + ' (' + scene.frame + ' frame)' : '(not set yet)';
    }

    function buildLayoutText() {
      const f = frameRect();
      const r = (n) => Math.round(n * 10000) / 10000;
      const lines = [
        'INVISIBLE BUTTON LAYOUT',
        'Exported: ' + new Date().toISOString(),
        'Page: index.html',
        'Video frame size: ' + f.vw + 'x' + f.vh + ' px',
        'Coordinates: origin is the top-left corner of the video frame.',
        '  "px" values are in video pixels; "%" values are fractions of the frame',
        '  (use the % values to position buttons at any window size).',
        'Sections: buttons listed under a section are only active in that section.',
        '',
      ];
      const json = [];
      for (let s = 1; s <= 9; s++) {
        const sec = devData[s];
        const nums = Object.keys(sec.buttons).sort();
        lines.push(
          '==================================================',
          'Section ' + s + ': ' + (sec.name || '(unnamed)'),
          '  scene: ' + sceneLabel(s),
          '--------------------------------------------------'
        );
        if (!nums.length) lines.push('  (no buttons yet)');
        lines.push('');
        for (const num of nums) {
          const h = sec.buttons[num];
          lines.push(
            'Button ' + num + (num === '1' ? ' (main button)' : '') + ': "' + (h.name || '') + '"',
            '  shown over: ' + h.video,
            '  px: x=' + Math.round(h.x * f.vw) + ' y=' + Math.round(h.y * f.vh) +
              ' width=' + Math.round(h.w * f.vw) + ' height=' + Math.round(h.h * f.vh),
            '  %:  left=' + pct(h.x) + ' top=' + pct(h.y) +
              ' width=' + pct(h.w) + ' height=' + pct(h.h),
            ''
          );
        }
        json.push({
          section: s,
          name: sec.name || '',
          scene: SCENES[s] || null,
          buttons: nums.map((num) => {
            const h = sec.buttons[num];
            return {
              button: Number(num), name: h.name || '', video: h.video,
              x: r(h.x), y: r(h.y), width: r(h.w), height: r(h.h),
            };
          }),
        });
      }
      lines.push(
        '==================================================',
        'JSON (x, y, width, height are fractions 0-1 of the video frame):',
        JSON.stringify({ frame: { width: f.vw, height: f.vh }, sections: json }, null, 2),
        ''
      );
      return lines.join('\n');
    }

    function downloadLayout() {
      const blob = new Blob([buildLayoutText()], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'button-layout.txt';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // ----- Holding Enter for 2 seconds toggles dev mode -----
    let holdTimer = null;

    function cancelHold() {
      clearTimeout(holdTimer);
      holdTimer = null;
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        // Enter inside a name box just finishes typing (handled on the box).
        if (e.target instanceof HTMLInputElement) return;
        // Don't let Enter "click" a focused button (e.g. a × delete button).
        e.preventDefault();
        // Held keys repeat keydown; only the first press starts the timer.
        if (!e.repeat && !holdTimer) {
          holdTimer = setTimeout(() => {
            holdTimer = null;
            if (devMode) closeDevMode(); else openDevMode();
          }, HOLD_MS);
        }
        return;
      }
      if (!devMode) return;
      // Typing a name, or using the section dropdown's own keys.
      if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;

      if (/^[1-9]$/.test(e.key)) {
        e.preventDefault();
        startDrawing(e.key);
      } else if (e.key === 'Escape') {
        stopDrawing();
      } else if (e.key === 'h' || e.key === 'H') {
        panel.classList.toggle('is-collapsed');
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') cancelHold();
    });
    // Switching apps/tabs mid-hold means we may never see the keyup.
    window.addEventListener('blur', cancelHold);

    function renderEverything() {
      renderAll();
      renderLive();
    }
    window.addEventListener('resize', renderEverything);
    vid1.addEventListener('loadedmetadata', renderEverything);
    vid2.addEventListener('loadedmetadata', renderEverything);
    renderEverything();
  </script>
